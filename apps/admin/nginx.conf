server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The HTML shell points at content-hashed Vite bundles. Always revalidate the
  # shell so a normal refresh cannot keep running an older deployment.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Vite asset names change whenever their content changes, so they are safe to
  # cache aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
