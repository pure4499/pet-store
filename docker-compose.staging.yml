name: tail-tells-staging

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://admin.${DOMAIN},https://app.ucbarkley.com
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["node", "apps/api/dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

  configure-runtime-db:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -v
      - app_password=${APP_DATABASE_PASSWORD}
      - -f
      - /config/configure-runtime-role.sql
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/gcp/configure-runtime-role.sql:/config/configure-runtime-role.sql:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      configure-runtime-db:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DATABASE_URL: postgres://pethotel_app:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: https://media.${DOMAIN}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      REPORTS_FROM_EMAIL: ${REPORTS_FROM_EMAIL}
      REPORTS_FROM_NAME: ${REPORTS_FROM_NAME:-UCBarkley}
      REPORTS_TEST_RECIPIENT: ${REPORTS_TEST_RECIPIENT:-}
      PUBLIC_REPORT_BASE_URL: https://api.${DOMAIN}/public/reports

  inference:
    build:
      context: apps/inference
    restart: unless-stopped
    environment:
      INFERENCE_MODEL_BACKEND: vision
      INFERENCE_EMBEDDER_BACKEND: ${INFERENCE_EMBEDDER_BACKEND:-resnet18}
      DETECTION_REVIEW_THRESHOLD: ${DETECTION_REVIEW_THRESHOLD:-0.10}
    volumes:
      - model_cache:/root/.cache/torch

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      configure-runtime-db:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      inference:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pethotel_app:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      INFERENCE_SERVICE_URL: http://inference:8000
      POLL_INTERVAL_MS: 3000

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
      - admin
      - minio
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  model_cache:
  caddy_data:
  caddy_config:
